  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #1d2021;
      color: #ebdbb2;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 30px 15px;
      line-height: 1.5;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
      border-bottom: 2px dashed #504945;
      padding-bottom: 20px;
    }

    h1 {
      font-size: 2.2rem;
      color: #fabd2f;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: #a89984;
      font-size: 0.95rem;
    }

    .catalog-container {
      max-width: 900px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    .font-card {
      background-color: #282828;
      border: 1px solid #3c3836;
      border-radius: 10px;
      padding: 20px;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .font-card:hover {
      border-color: #d79921;
      transform: translateY(-2px);
    }

    .font-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px solid #3c3836;
      padding-bottom: 8px;
    }

    .font-name {
      font-size: 0.9rem;
      font-weight: bold;
      color: #83a598;
    }

    .font-file {
      font-size: 0.8rem;
      color: #928374;
      background: #1d2021;
      padding: 2px 8px;
      border-radius: 4px;
    }

    .preview-text {
      font-size: 1.8rem;
      color: #fbf1c7;
      word-break: break-word;
    }
